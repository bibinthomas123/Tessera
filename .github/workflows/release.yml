name: release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (e.g. v1.0.0)"
        required: true
permissions:
  contents: read
env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
jobs:
  pypi:
    # PyPI trusted publishing: project tessera-gw, workflow release.yml, environment pypi.
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tessera-gw
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.TAG }}"}
      - name: Use the files attached to the GitHub release (identical bytes on PyPI and GitHub)
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.whl' --pattern '*.tar.gz' --dir dist || true
          if ! ls dist/*.whl dist/*.tar.gz >/dev/null 2>&1; then
            pip install build && python -m build --sdist --wheel -o dist .
          fi
          ls -l dist
      - name: Check the version matches the tag
        run: |
          want="${TAG#v}"
          ls dist | grep -q "tessera_gw-${want}-py3-none-any.whl" || { echo "wheel version does not match tag $TAG"; exit 1; }
          pip install twine && twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.TAG }}"}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ghcr.io/<owner>/tessera
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          tag="${TAG#v}"
          image="ghcr.io/${owner}/tessera"
          docker build -t "${image}:${tag}" -t "${image}:latest" .
          docker run --rm "${image}:${tag}" tessera --version
          docker push "${image}:${tag}"
          docker push "${image}:latest"
