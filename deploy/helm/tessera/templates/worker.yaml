apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tessera.fullname" . }}-worker
  labels: {{- include "tessera.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels: {{- include "tessera.selector" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "tessera.selector" (dict "root" . "component" "worker") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.worker.metricsPort }}"
    spec:
      {{- include "tessera.podCommon" . | nindent 6 }}
      terminationGracePeriodSeconds: {{ add .Values.config.jobTimeoutS 30 }}
      containers:
        - name: worker
          {{- include "tessera.containerCommon" . | nindent 10 }}
          args: ["tessera", "worker"]
          ports: [{name: metrics, containerPort: {{ .Values.worker.metricsPort }}}]
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
