apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tessera.fullname" . }}-env
  labels: {{- include "tessera.labels" . | nindent 4 }}
data:
  TESSERA_DATA_DIR: /data
  TESSERA_CATALOG_DIRS: /catalogs
  TESSERA_TRIGGER_POLICY: /etc/tessera/trigger-policy.yaml
  TESSERA_MODE: {{ .Values.config.mode | quote }}
  TESSERA_DEFAULT_CATALOG: {{ .Values.config.defaultCatalog | quote }}
  TESSERA_ROOT_PATH: {{ .Values.config.rootPath | quote }}
  TESSERA_TRUSTED_PROXIES: {{ .Values.config.trustedProxies | quote }}
  TESSERA_MAX_QUEUE_DEPTH: {{ .Values.config.maxQueueDepth | quote }}
  TESSERA_MAX_JOBS_PER_KEY: {{ .Values.config.maxJobsPerKey | quote }}
  TESSERA_JOB_TIMEOUT_S: {{ .Values.config.jobTimeoutS | quote }}
  TESSERA_JOB_MEMORY_BYTES: {{ .Values.config.jobMemoryBytes | quote }}
  TESSERA_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  TESSERA_WORKER_METRICS_PORT: {{ .Values.worker.metricsPort | quote }}
  TESSERA_IERS_AUTO_DOWNLOAD: "0"
  HOME: /tmp                    # astropy cache/config must be writable; root filesystem is read-only
  {{- with .Values.config.oidc }}
  {{- if and .issuer .audience }}
  TESSERA_OIDC_ISSUER: {{ .issuer | quote }}
  TESSERA_OIDC_AUDIENCE: {{ .audience | quote }}
  TESSERA_OIDC_JWKS_URL: {{ .jwksUrl | quote }}
  TESSERA_OIDC_SCOPES_CLAIM: {{ .scopesClaim | quote }}
  TESSERA_OIDC_USER_CLAIM: {{ .userClaim | quote }}
  {{- end }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tessera.fullname" . }}
  labels: {{- include "tessera.labels" . | nindent 4 }}
data:
  trigger-policy.yaml: |
    {{- .Values.config.triggerPolicy | nindent 4 }}
