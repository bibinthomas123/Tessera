apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tessera.fullname" . }}-api
  labels: {{- include "tessera.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {{- include "tessera.selector" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "tessera.selector" (dict "root" . "component" "api") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- include "tessera.podCommon" . | nindent 6 }}
      containers:
        - name: api
          {{- include "tessera.containerCommon" . | nindent 10 }}
          args: ["tessera", "serve", "--host", "0.0.0.0", "--port", "{{ .Values.api.port }}", "--behind-proxy"]
          ports: [{name: http, containerPort: {{ .Values.api.port }}}]
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 20}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tessera.fullname" . }}-api
  labels: {{- include "tessera.labels" . | nindent 4 }}
spec:
  selector: {{- include "tessera.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports: [{name: http, port: 80, targetPort: http}]
